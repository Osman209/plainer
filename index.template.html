<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="A style editor for academic and technical prose in English, Arabic and Spanish. It shows every change with the reason for it, so you decide.">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@400;500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#E3E6E1}
  #root{min-height:100vh}
  #boot{min-height:100vh;display:grid;place-items:center;font:15px/1.6 'IBM Plex Sans',system-ui,sans-serif;color:#6E736D}
</style>
</head>
<body>
<div id="root"><div id="boot">Loading…</div></div>

<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
/* The app is compiled ahead of time, so there is no JSX compiler in the
   page and nothing to wait for beyond React itself. */
window.addEventListener('error', function (e) {
  var boot = document.getElementById('boot');
  if (boot) boot.textContent = 'Something failed to load: ' + (e.message || 'unknown error');
});
</script>

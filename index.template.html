<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plainer — shows you what it changed, and why</title>
<meta name="description" content="Review English and Arabic writing, import documents, and understand every edit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@400;500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#E3E6E1}
  #root{min-height:100vh}
  #boot{min-height:100vh;display:grid;place-items:center;font:15px/1.6 'IBM Plex Sans',system-ui,sans-serif;color:#6E736D}
  *{box-sizing:border-box}
  button,select{font:inherit}
  button,select,a{touch-action:manipulation}
  button:focus-visible,select:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #278373;outline-offset:3px}
  .service-bar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:18px max(20px,calc((100vw - 1200px)/2));background:#183d36;color:#fff;font:14px/1.6 system-ui}
  .service-bar>div{display:flex;align-items:center;gap:10px}
  .service-bar select{max-width:100%;padding:9px;border:1px solid #b5cbc2;border-radius:8px;background:#fff;color:#163c33}
  .service-bar>span{flex:1;min-width:220px;color:#d2e5de;font-size:12px}
  .file-zone{display:flex;flex-wrap:wrap;align-items:center;gap:18px;border:1px dashed #8bac9c;border-radius:16px;background:#f5faf7;padding:22px;margin-bottom:20px;font:14px/1.7 system-ui}
  .file-zone>div{flex:1;min-width:200px}.file-zone h2{margin:0 0 5px;font-size:20px;color:#193e34}.file-zone p{margin:0 0 8px}.file-zone small{color:#526a60}.file-zone.dragging{background:#deeee4;border-color:#246f55}
  .file-zone button,dialog button{padding:10px 18px;border:1px solid #285c48;border-radius:8px;background:#285c48;color:white;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}.file-name{flex-basis:100%;overflow-wrap:anywhere}.file-name button{padding:4px 10px;background:transparent;color:#285c48}
  dialog{width:min(680px,calc(100vw - 32px));max-height:88vh;overflow:auto;border:1px solid #abb5ad;border-radius:18px;padding:28px;color:#16191a;font:15px/1.8 system-ui}
  dialog::backdrop{background:#12282099;backdrop-filter:blur(3px)}dialog textarea{width:100%;height:150px;padding:12px;margin:8px 0;border:1px solid #a1b5aa;border-radius:8px;font:13px/1.6 system-ui}dialog a{color:#245c47} [role=alert]{color:#a12323}
  @media(max-width:640px){.service-bar{padding:14px}.service-bar>div{width:100%;justify-content:space-between}.service-bar select{max-width:75%}.file-zone{padding:16px}dialog{padding:18px}}
</style>
</head>
<body>
<div id="root"><div id="boot"></div></div>
<script>
try {
  var arabic = localStorage.getItem('plainer:language') === 'ar';
  document.documentElement.lang = arabic ? 'ar' : 'en';
  document.documentElement.dir = arabic ? 'rtl' : 'ltr';
  document.getElementById('boot').textContent = arabic ? 'جارٍ التحميل…' : 'Loading…';
} catch { document.getElementById('boot').textContent = 'Loading…'; }
</script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="./mammoth.browser.js"></script>
<script>
/* The app is compiled ahead of time, so there is no JSX compiler in the
   page and nothing to wait for beyond React itself. */
window.addEventListener('error', function (e) {
  var boot = document.getElementById('boot');
  if (boot) boot.textContent = document.documentElement.lang === 'ar' ? 'تعذر تحميل الصفحة. تحقق من الاتصال ثم أعد المحاولة.' : 'Could not load the page. Check your connection and try again.';
});
</script>
<script>
/* APP_BUNDLE */
</script>
</body>
</html>
